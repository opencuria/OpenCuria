# Uploads the dev branch to TestFlight: nightly when the app changed since the last
# upload, and on demand. It builds on GitHub's macOS runner with `eas build --local`
# (iOS credentials and build numbers stay on EAS) and uploads with an App Store
# Connect API key. Scheduled and manual runs use this file from the default branch.
#
# Secrets: EXPO_TOKEN, ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_P8 (.p8 text).
# The tag testflight-dev marks the last uploaded commit (pushed with GITHUB_TOKEN,
# so it starts no workflow).

name: TestFlight (dev)

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC
  workflow_dispatch:

concurrency:
  group: testflight-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  EAS_CLI_VERSION: 27.11.0
  XCODE_VERSION: "26.6"

jobs:
  changes:
    name: Check dev for app changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
      sha: ${{ steps.diff.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: diff
        run: |
          echo "sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]] ||
            ! git rev-parse -q --verify refs/tags/testflight-dev >/dev/null ||
            ! git diff --quiet testflight-dev HEAD -- mobile packages package.json \
              package-lock.json ':(exclude,glob)**/*.md'; then
            echo "build=true" >>"${GITHUB_OUTPUT}"
          else
            echo "No app changes since $(git rev-parse --short testflight-dev)."
            echo "build=false" >>"${GITHUB_OUTPUT}"
          fi

  build:
    name: Build and upload to TestFlight
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          missing=()
          for name in EXPO_TOKEN ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8; do
            [[ -n "${!name}" ]] || missing+=("${name}")
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check the app
        run: |
          npm run test:shared
          npm run type-check -w mobile
          npm run test -w mobile
      # pod install fetches Hermes and React Native prebuilds with plain curl,
      # which gives up on a reset connection. Retry those like timeouts.
      - name: Retry downloads
        run: printf '%s\n' 'retry = 5' 'retry-delay = 10' 'retry-all-errors' >>"${HOME}/.curlrc"
      - name: Build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          npx --yes "eas-cli@${EAS_CLI_VERSION}" build --local --platform ios
          --profile production --non-interactive --output "${RUNNER_TEMP}/OpenCuria.ipa"
      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          key="${RUNNER_TEMP}/asc-api-key.json"
          jq -n --arg key_id "${ASC_API_KEY_ID}" --arg issuer_id "${ASC_API_ISSUER_ID}" \
            --arg key "${ASC_API_KEY_P8}" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, duration: 1200, in_house: false}' \
            >"${key}"
          fastlane pilot upload --ipa "${RUNNER_TEMP}/OpenCuria.ipa" \
            --apple_id "$(jq -r .submit.production.ios.ascAppId mobile/eas.json)" \
            --api_key_path "${key}" --skip_waiting_for_build_processing true

  # Separate job: only it can write, and it runs no third-party build code.
  mark:
    name: Mark the uploaded commit
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - run: git push --force origin HEAD:refs/tags/testflight-dev
