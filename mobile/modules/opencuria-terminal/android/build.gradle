plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.opencuriaterminal'
version = '0.1.0'

android {
  namespace "expo.modules.opencuriaterminal"
  ndkVersion rootProject.ext.ndkVersion

  defaultConfig {
    versionCode 1
    versionName "0.1.0"

    // The prebuilt libghostty-vt ships the four React Native ABIs; follow the
    // app's architecture selection so a single-ABI dev build stays small.
    def requestedArchitectures = project.findProperty('reactNativeArchitectures')
    if (requestedArchitectures) {
      ndk {
        abiFilters(*requestedArchitectures.split(','))
      }
    }

    externalNativeBuild {
      cmake {
        cppFlags '-std=c++17 -Wall -Wextra -Werror'
      }
    }
  }

  externalNativeBuild {
    cmake {
      path 'src/main/cpp/CMakeLists.txt'
      version '3.22.1'
    }
  }
}
