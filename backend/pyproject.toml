[project]
name = "opencuria-backend"
version = "0.1.0"
description = "Central control plane for opencuria coding agent platform"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

# The Agent-S port keeps verbatim upstream texts (prompt constants, action
# docstrings, snippet constants) byte-identical to the pinned commit, so
# reformatting them would destroy parity. Only these two files carry a
# file-local `# ruff: noqa` for the purely cosmetic rules; every other
# agent_s core/test file is linted and formatted normally.
[tool.ruff.lint.per-file-ignores]
"apps/harness/agent_s/prompts.py" = ["E501", "W291", "W293", "I001"]
"apps/harness/agent_s/actions.py" = ["E501", "UP006", "UP035", "UP045", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps", "common"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
