map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
include /etc/nginx/opencuria/upstreams.conf;
server {
    listen 80;
    server_name _;
    client_max_body_size 210m;
    location /api/ { proxy_pass http://opencuria_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /ws/runner/ { proxy_pass http://opencuria_socket_gateway; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_read_timeout 86400s; }
    location /ws/ { proxy_pass http://opencuria_socket_gateway; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_read_timeout 86400s; }
    location /socket.io/ { proxy_pass http://opencuria_socket_gateway; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_read_timeout 86400s; }
    location /mcp { proxy_pass http://opencuria_backend; proxy_http_version 1.1; proxy_set_header Host $host; proxy_read_timeout 86400s; }
    location / { proxy_pass http://opencuria_webapp; proxy_set_header Host $host; }
}
