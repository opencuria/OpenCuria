# Fail closed until the first healthy application slot is cut over; avoid
# resolving a not-yet-created blue/green service during proxy startup.
upstream opencuria_backend {
    server 127.0.0.1:9 down;
}
upstream opencuria_webapp {
    server 127.0.0.1:9 down;
}
upstream opencuria_socket_gateway {
    server 127.0.0.1:9 down;
}
