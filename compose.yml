name: opencuria-local
services:
  backend:
    image: ghcr.io/opencuria/backend:${OPENCURIA_TAG:-latest}
    build: &backend_build
      context: ./backend
      dockerfile: Dockerfile
    container_name: opencuria_local_backend
    restart: unless-stopped
    environment: &id002
      DJANGO_ENV: development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-secret-key-change-me}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY_FILE: ${APNS_PRIVATE_KEY_FILE:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      SQLITE_PATH: /data/db.sqlite3
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY
        is required}
      MCP_OAUTH_CALLBACK_URL: ${MCP_OAUTH_CALLBACK_URL:-http://127.0.0.1:8000/api/v1/mcp-oauth/callback/}
      MCP_OAUTH_FRONTEND_RETURN_URL: ${MCP_OAUTH_FRONTEND_RETURN_URL:-http://127.0.0.1:8080/?settings=credentials}
      DJANGO_SUPERUSER_EMAIL: ${LOCAL_ADMIN_EMAIL:-admin@localhost.test}
      DJANGO_SUPERUSER_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-CHANGE_ME_local_admin_password}
      REDIS_URL: redis://redis:6379/0
    volumes: &id003
    - backend-data:/data
    - ./secrets/push:/run/secrets:ro
    ports:
    - 127.0.0.1:${BACKEND_PORT:-8000}:8000
    networks: &id004
    - opencuria-local
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  webapp:
    image: ghcr.io/opencuria/webapp:${OPENCURIA_TAG:-latest}
    build:
      context: .
      dockerfile: webapp/Dockerfile
    container_name: opencuria_local_webapp
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:${BACKEND_PORT:-8000}/api/v1
      VITE_WS_BASE_URL: http://127.0.0.1:${BACKEND_PORT:-8000}
    ports:
    - 127.0.0.1:${WEBAPP_PORT:-8080}:80
    networks:
    - opencuria-local
  bootstrap:
    image: ghcr.io/opencuria/backend:${OPENCURIA_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opencuria_local_bootstrap
    restart: 'no'
    depends_on:
      backend:
        condition: service_healthy
    entrypoint:
    - python
    - manage.py
    - bootstrap_local_deploy
    - --admin-email
    - ${LOCAL_ADMIN_EMAIL:-admin@localhost.test}
    - --admin-password
    - ${LOCAL_ADMIN_PASSWORD:-CHANGE_ME_local_admin_password}
    - --organization-name
    - ${LOCAL_ORGANIZATION_NAME:-Local}
    - --runner-name
    - ${LOCAL_RUNNER_NAME:-local-qemu}
    - --runner-token
    - ${LOCAL_RUNNER_API_TOKEN:-local-runner-token-change-me}
    - --image-definition-name
    - ${LOCAL_IMAGE_DEFINITION_NAME:-Local Workspace}
    environment:
      DJANGO_ENV: development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-secret-key-change-me}
      SQLITE_PATH: /data/db.sqlite3
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY
        is required}
      MCP_OAUTH_CALLBACK_URL: ${MCP_OAUTH_CALLBACK_URL:-http://127.0.0.1:8000/api/v1/mcp-oauth/callback/}
      MCP_OAUTH_FRONTEND_RETURN_URL: ${MCP_OAUTH_FRONTEND_RETURN_URL:-http://127.0.0.1:8080/?settings=credentials}
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:-admin@localhost.test}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-CHANGE_ME_local_admin_password}
      LOCAL_ORGANIZATION_NAME: ${LOCAL_ORGANIZATION_NAME:-Local}
      LOCAL_RUNNER_NAME: ${LOCAL_RUNNER_NAME:-local-qemu}
      LOCAL_RUNNER_API_TOKEN: ${LOCAL_RUNNER_API_TOKEN:-local-runner-token-change-me}
      LOCAL_IMAGE_DEFINITION_NAME: ${LOCAL_IMAGE_DEFINITION_NAME:-Local Workspace}
    volumes:
    - backend-data:/data
    networks:
    - opencuria-local
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
    - opencuria-local
  recovery:
    image: ghcr.io/opencuria/backend:${OPENCURIA_TAG:-latest}
    build: *backend_build
    restart: unless-stopped
    environment: *id002
    volumes: *id003
    networks: *id004
    container_name: opencuria_local_recovery
    entrypoint:
    - python
    - manage.py
    - recover_lifecycle
    depends_on:
      backend:
        condition: service_healthy
volumes:
  backend-data: null
networks:
  opencuria-local:
    name: opencuria-local
