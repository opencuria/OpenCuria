# Control plane. install.sh copies this file to /opt/opencuria and writes its .env;
# required variables fail with a message below.
name: opencuria
services:
  db:
    image: postgres:16-alpine
    container_name: opencuria_db
    restart: unless-stopped
    volumes:
    - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-opencuria}
      POSTGRES_USER: ${DB_USER:-opencuria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    networks:
    - opencuria-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USER:-opencuria}
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    container_name: opencuria_redis
    restart: unless-stopped
    volumes:
    - redisdata:/data
    networks:
    - opencuria-net
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    image: ghcr.io/opencuria/backend:${OPENCURIA_TAG:-latest}
    container_name: opencuria_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &backend_environment
      DJANGO_ENV: production
      EXECUTION_PROCESS_LOCK_PATH: /var/lib/opencuria/backend/process.lock
      MEDIA_ROOT: /var/lib/opencuria/backend/media
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      # End-to-end encrypted push proxy for the mobile app; empty turns push off.
      PUSH_PROXY_URL: ${PUSH_PROXY_URL-https://push.opencuria.dev}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_NAME: ${DB_NAME:-opencuria}
      DB_USER: ${DB_USER:-opencuria}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: '5432'
      REDIS_URL: redis://redis:6379/0
      # Web app and API share one origin (PUBLIC_URL) behind the proxy.
      CSRF_TRUSTED_ORIGINS: ${PUBLIC_URL:?PUBLIC_URL is required}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      SIO_CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      MCP_OAUTH_CALLBACK_URL: ${PUBLIC_URL}/api/v1/mcp-oauth/callback/
      MCP_OAUTH_FRONTEND_RETURN_URL: ${PUBLIC_URL}/?settings=credentials
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY
        is required}
    volumes: &backend_volumes
    - backend-runtime:/var/lib/opencuria/backend
    ports:
    - ${BACKEND_PORT:-127.0.0.1:8000}:8000
    networks: &id002
    - opencuria-net
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
  execution:
    image: ghcr.io/opencuria/backend:${OPENCURIA_TAG:-latest}
    container_name: opencuria_execution
    restart: unless-stopped
    entrypoint: [python, manage.py, execute_harness]
    environment: *backend_environment
    volumes: *backend_volumes
    networks: *id002
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
  webapp:
    image: ghcr.io/opencuria/webapp:${OPENCURIA_TAG:-latest}
    container_name: opencuria_webapp
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
    - ${WEBAPP_PORT:-127.0.0.1:8080}:80
    networks:
    - opencuria-net
  recovery:
    image: ghcr.io/opencuria/backend:${OPENCURIA_TAG:-latest}
    restart: unless-stopped
    environment: *backend_environment
    volumes: *backend_volumes
    networks: *id002
    container_name: opencuria_recovery
    entrypoint:
    - python
    - manage.py
    - recover_lifecycle
    depends_on:
      backend:
        condition: service_healthy
  proxy:
    image: caddy:2-alpine
    container_name: opencuria_proxy
    restart: unless-stopped
    profiles:
    - proxy
    depends_on:
    - backend
    - webapp
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
    ports:
    - 80:80
    - 443:443
    - 443:443/udp
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy-data:/data
    - caddy-config:/config
    networks:
    - opencuria-net
    - edge
volumes:
  backend-runtime: null
  pgdata: null
  redisdata: null
  caddy-data: null
  caddy-config: null
networks:
  opencuria-net:
    driver: bridge
  # Only the proxy and services it fronts on this host, such as a push proxy
  # (push-proxy/compose.colocated.yml); they never reach the database.
  edge:
    driver: bridge
